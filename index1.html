<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
       @import url('https://fonts.googleapis.com/css2?family=Pavanam&display=swap');
       @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap');
    </style>
</head>
<body class="min-h-screen overflow-y-hidden fixed inset-0 bg-[url('abstractbg.jpg')] bg-cover bg-center z-[-10] scale-110"> <!--Contains a backup image-->
    <video 
    autoplay muted loop playsinline
    class="fixed top-0  left-0 w-full h-full object-cover -z-10">
    <source src="bg-vid.mp4" type="video/mp4">
    </video>    
    
    <div class="flex flex-col justify-center items-center h-screen">
        <div class="w-[14rem] h-[30rem] lg:w-[20rem] flex justify-center items-center lg:h-[35rem] shadow-sm shadow-white lg:mb-0 rounded-[2rem] backdrop-blur-[1rem] bg-white/50 mb-[5rem] ">
            <div class="flex justify-center w-[14rem] lg:w-[62rem] h-full mx-[3rem]">
                <div>
                    <h1 class="text-[2.7rem] lg:text-[3.8rem] font-['Gowun_Dodum'] mt-5">welcome!</h1>
                    <p class="font-['Pavanam'] font-bold lg:font-thin lg:ml-3 text-[1rem] lg:text-[1.2rem]">Please login via e-mail/phone </p>
                    <form action="/login" method="POST">
                        <div class="group bg-white/0 border-white border-2 rounded-lg mt-6 lg:mt-7 px-4 py-3 hover:bg-white/60 transition-all duration-200 lg:scale-110 ">                        
                            <p class="lg:text-[0.9rem] ml-0 lg:ml-0 text-white group-hover:text-[0.7rem] group-hover:pb-[0.45rem] group-hover:text-black transition-all duration-300 ease-in-out">e-mail / Phone No.</p>
                            <input type="email" placeholder="abcd@gmail.com" required class="font-['Google_Sans_Code'] text-[0.65rem] text-white lg:text-[0.8rem] w-[9rem] lg:w-[13rem] bg-white/0 ml-0 lg:ml-0 placeholder:text-white/50 focus:outline-0 caret-white group-hover:scale-[1.18] group-hover:pl-[0.6rem] lg:group-hover:pl-[0.87rem] group-hover:text-black  transition-all duration-300 ease-in-out"></input>
                        </div>
                        <div class="group bg-white/0 border-white border-2 rounded-lg mt-6 lg:mt-10 px-4 py-3 hover:bg-white/60 transition-all duration-200  lg:scale-110 ">                        
                            <p class="font-['Gowun_Dodum'] ml-0 lg:ml-0 text-white group-hover:text-[0.7rem] group-hover:pb-[0.45rem] group-hover:text-black transition-all duration-300 ease-in-out">Password</p>
                            <input type="password" placeholder="your_password123" required class="font-['Google_Sans_Code'] text-[0.85rem] text-white group-hover:text-black lg:text-[0.85rem] w-[9rem] lg:w-[13rem] bg-white/0 ml-0 lg:ml-0 placeholder:text-white/50 focus:outline-0 ring-0 focus:ring-0 caret-white group-hover:scale-[1.18] group-hover:pl-[0.6rem] lg:group-hover:pl-[0.87rem] transition-all duration-300 ease-in-out"></input>
                        </div>
                        <div class="lg:mt-1">
                            <a href="#" target="_blank" class="relative pt-3 pl-2 font-['Gowun_Dodum'] lg:p-0">Forgot password ?</a>
                        </div>
                    </form>
                    <div class="flex">
                        <input type="button" value="Login" class="absolute h-12 w-[11.5rem] lg:w-[16rem] lg:left-8 text-[1rem] mt-4 font-['Gowun_Dodum'] border-2 border-white rounded-[1rem] text-white hover:bg-white/60 hover:text-black transition-all duration-200 "></input>
                    </div>
                    <div class="flex flex-col mt-[4.3rem] text-[1.4rem] font-['Pavanam']">
                        <h3>New Here ?</h3>
                        <a>Sign Up !</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="fixed mt-[33rem] lg:mt-[50rem]">
            <div class=" max-h-max text-white font-['Google_Sans_Code'] flex flex-wrap justify-center gap-4 text-[0.9rem] lg:text-[1.3rem] ">
                <a href="#" target="_blank" class="hover:text-yellow-300 transition-all duration-300 ease-in-out">
                    Terms
                </a>
                <a href="#" target="_blank" class="hover:text-yellow-300 transition-all duration-300 ease-in-out">
                    About
                </a>
                <a href="#" target="_blank" class="hover:text-yellow-300 transition-all duration-300 ease-in-out">
                    Jobs
                </a>
                <a href="#" target="_blank" class="hover:text-yellow-300 transition-all duration-300 ease-in-out">
                    Help
                </a>
                <a href="#" target="_blank" class="hover:text-yellow-300 transition-all duration-300 ease-in-out">
                    Privacy
                </a>
            </div>

        </div>
    </div>
</body>
</html>
