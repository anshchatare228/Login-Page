<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
       @import url('https://fonts.googleapis.com/css2?family=Pavanam&display=swap');
       @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
       @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap');
    </style>
</head>
<body class="h-screen overflow-y-hidden inset-0 bg-[url('bg.png')] bg-cover bg-center scale-90 bg-no-repeat"> <!--Contains a backup image-->
    <!-- <video 
    autoplay muted loop playsinline
    class="fixed top-0  left-0 w-full h-full object-cover -z-10">
    <source src="bg-vid.mp4" type="video/mp4">
    </video>     -->
    
    <div class="flex flex-col justify-center items-center h-screen">
        <div class="w-[14rem] h-[28rem] lg:w-[28rem] lg:h-[33rem] shadow-2xl shadow-black border-[0.01rem] border-white/20 flex justify-center items-center  lg:mb-0 rounded-[2rem] backdrop-blur-[0.3rem] bg-slate-300/10 mb-[5rem] ">
            <div class="flex justify-center w-[14rem] lg:w-[62rem] h-full mx-[3rem]">
                <div>
                    <h1 class="text-[0.9rem] text-white lg:text-[1.9rem] pl-1.5 lg:pl-0 font-['poppins'] mt-7">Sign in to your account</h1>
                    <p class="font-['Pavanam'] mt-[0.8rem] lg:pl-10 text-gray-200/70 lg:font-thin lg:ml-2 ml-1 text-[0.94rem] lg:text-[1.3rem]">Please login via email / phone </p>
                    <form action="/login" method="POST">
                        <div class="group bg-white/0 border-white/60 border-2 rounded-lg mt-6 lg:mt-7 px-4 py-3 hover:bg-white/70 transition-all duration-200 lg:scale-110 ">                        
                            <p class="lg:text-[0.9rem] ml-0 lg:ml-0 text-white group-hover:text-[0.7rem] group-hover:pb-[0.3rem] group-hover:text-black transition-all duration-300 ease-in-out">E-mail / Phone No.</p>
                            <input type="email" placeholder="abcd@gmail.com" required class="font-['Google_Sans_Code'] text-[0.65rem] text-white lg:text-[0.98rem] w-[9rem] lg:w-[13rem] bg-white/0 ml-0 lg:ml-0 placeholder:text-white/50 focus:outline-0 caret-white group-hover:scale-[1.18] group-hover:pl-[0.6rem] lg:group-hover:pl-[0.87rem] group-hover:text-black group-hover:placeholder:text-black transition-all duration-300 ease-in-out"></input>
                        </div>
                        <div class="group bg-white/0 border-white/60 border-2 rounded-lg mt-6 lg:mt-10 px-4 py-3 hover:bg-white/100 transition-all duration-200  lg:scale-110 lg:hover:pb-[0.76rem]">                        
                            <p class="font-['Gowun_Dodum'] ml-0 lg:ml-0 text-white group-hover:text-[0.7rem] group-hover:pb-[0.45rem] group-hover:text-black transition-all duration-300 ease-in-out">Password</p>
                            <input type="password" placeholder="your_password123" required class="font-['Google_Sans_Code'] text-[0.85rem] text-white group-hover:text-black lg:text-[0.85rem] w-[9rem] lg:w-[13rem] bg-white/0 ml-0 lg:ml-0 placeholder:text-white/50 focus:outline-0 ring-0 focus:ring-0 caret-white group-hover:scale-[1.18] group-hover:pl-[0.6rem] lg:group-hover:pl-[0.87rem] group-hover:placeholder:text-black transition-all duration-300 ease-in-out"></input>
                        </div>
                        <div class="lg:mt-1">
                            <a href="#" target="_blank" class="relative pt-3 pl-2 text-white/60 font-['Gowun_Dodum'] lg:p-0">Forgot password ?</a>
                        </div>
                    </form>
                    <div class="">
                        <div class="flex">
                            <input type="button" value="Sign in" class="absolute h-10 lg:h-12 w-[11.5rem] lg:w-[24rem] lg:left-8 bg-white text-[1rem] lg:text-[1.4rem] tracking-[0.1rem] mt-4 font-['Gowun_Dodum'] border-2 border-white rounded-[0.7rem] text-black hover:scale-[1.05] hover:text-black transition-all duration-200 "></input>
                        </div>
                        <div class="flex gap-3 lg:gap-4 mt-[4.5rem] lg:mt-[5.3rem] lg:pl-[3rem] pl-[0.5rem] lg:text-[1.4rem] font-['Poppins']">
                            <h3 class=" text-white font-thin">New Here ?</h3>
                            <a href="sign_up.html" class="text-white hover:text-yellow-300 transition-all duration-300 ease-in-out">Sign Up !</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="fixed mt-[33rem] lg:mt-[50rem]">
            <div class=" max-h-max text-white font-['Google_Sans_Code'] flex flex-wrap justify-center gap-4 text-[0.9rem] lg:text-[1.3rem] ">
                <a href="#" target="_blank" class="hover:text-yellow-300 transition-all duration-300 ease-in-out">
                    Terms
                </a>
                <a href="#" target="_blank" class="hover:text-yellow-300 transition-all duration-300 ease-in-out">
                    About
                </a>
                <a href="#" target="_blank" class="hover:text-yellow-300 transition-all duration-300 ease-in-out">
                    Jobs
                </a>
                <a href="#" target="_blank" class="hover:text-yellow-300 transition-all duration-300 ease-in-out">
                    Help
                </a>
                <a href="#" target="_blank" class="hover:text-yellow-300 transition-all duration-300 ease-in-out">
                    Privacy
                </a>
            </div>

        </div>
    </div>
</body>
</html>
